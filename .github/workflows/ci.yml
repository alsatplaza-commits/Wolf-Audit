name: WOLF AUDITOR baseline checks
on:
  push:
  pull_request:
permissions:
  contents: read
jobs:
  baseline:
    name: Unit tests (${{ matrix.os }})
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, windows-latest]
    runs-on: ${{ matrix.os }}
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
      - name: Python 3.11+
        shell: bash
        run: python --version
      - name: Unit tests (safe fixtures)
        shell: bash
        run: python -m unittest discover -s tests -v
      - name: Package install and import
        shell: bash
        run: |
          python -m venv "$RUNNER_TEMP/wolfvenv"
          if [ -x "$RUNNER_TEMP/wolfvenv/bin/python" ]; then
            py="$RUNNER_TEMP/wolfvenv/bin/python"
          else
            py="$RUNNER_TEMP/wolfvenv/Scripts/python.exe"
          fi
          "$py" -m pip install --disable-pip-version-check .
          cd "$RUNNER_TEMP"
          "$py" -c "import wolf_auditor; from wolf_auditor.rust_safety import analyze_rust; from wolf_auditor.windows_native import runtime_inspection; from wolf_auditor.fuzz_control import run_controlled_fuzz; assert 'site-packages' in wolf_auditor.__file__.replace('\\\\','/'); info=runtime_inspection(); assert info['status'] != 'PASS' and info['coverage_claim'] is False; result=run_controlled_fuzz(None, seed=b'abc', iterations=1, timeout_seconds=1, max_input_bytes=4); assert result['coverage_claim'] is False and result['status']=='NOT_EXECUTED'"
      - name: Self-audit (read-only, explicit non-certification)
        shell: bash
        run: |
          code=0
          python -m wolf_auditor . --output wolf-auditor-self-report.json --sarif wolf-auditor.sarif --sbom wolf-auditor.cdx.json || code=$?
          if [ "$code" -eq 2 ]; then
            echo "INCOMPLETE scan; fail closed"
            exit 2
          fi
          echo "Heuristic findings are inventory, not an independent security approval"
          exit 0
      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4.6.2
        if: always()
        with:
          name: baseline-evidence-${{ matrix.os }}
          path: |
            wolf-auditor-self-report.json
            wolf-auditor.sarif
            wolf-auditor.cdx.json
          if-no-files-found: ignore
