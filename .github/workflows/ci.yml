name: WOLF AUDITOR baseline checks
on:
  push:
  pull_request:
permissions:
  contents: read
jobs:
  baseline:
    name: Unit tests (${{ matrix.os }})
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, windows-latest]
    runs-on: ${{ matrix.os }}
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
      - name: Rust syntax backend
        shell: bash
        run: |
          if ! command -v cargo >/dev/null 2>&1; then
            if [ "$RUNNER_OS" = "Windows" ]; then
              curl -fsS -o rustup-init.exe https://win.rustup.rs/x86_64
              ./rustup-init.exe -y --profile minimal --default-toolchain 1.83.0
              export PATH="$USERPROFILE/.cargo/bin:$PATH"
            else
              curl --proto '=https' --tlsv1.2 -fsS https://sh.rustup.rs | sh -s -- -y --profile minimal --default-toolchain 1.83.0
              . "$HOME/.cargo/env"
            fi
          fi
          cargo build --locked --manifest-path tools/wolf_syn/Cargo.toml
          if [ -f tools/wolf_syn/target/debug/wolf_syn.exe ]; then
            bin="$PWD/tools/wolf_syn/target/debug/wolf_syn.exe"
          else
            bin="$PWD/tools/wolf_syn/target/debug/wolf_syn"
          fi
          if command -v cygpath >/dev/null 2>&1; then
            bin="$(cygpath -m "$bin")"
          fi
          echo "WOLF_SYN_BIN=$bin" >> "$GITHUB_ENV"
      - name: Python 3.11+
        shell: bash
        run: python --version
      - name: Unit tests (safe fixtures)
        shell: bash
        run: python -m unittest discover -s tests -v
      - name: Package install and import
        shell: bash
        run: |
          python -m venv "$RUNNER_TEMP/wolfvenv"
          if [ -x "$RUNNER_TEMP/wolfvenv/bin/python" ]; then
            py="$RUNNER_TEMP/wolfvenv/bin/python"
          else
            py="$RUNNER_TEMP/wolfvenv/Scripts/python.exe"
          fi
          "$py" -m pip install --disable-pip-version-check .
          cd "$RUNNER_TEMP"
          "$py" -c "import wolf_auditor; from wolf_auditor.rust_safety import analyze_rust; from wolf_auditor.windows_native import runtime_inspection; from wolf_auditor.fuzz_control import run_controlled_fuzz; assert 'site-packages' in wolf_auditor.__file__.replace('\\\\','/'); info=runtime_inspection(); assert info['status'] != 'PASS' and info['coverage_claim'] is False; result=run_controlled_fuzz(None, seed=b'abc', iterations=1, timeout_seconds=1, max_input_bytes=4); assert result['coverage_claim'] is False and result['status']=='NOT_EXECUTED'"
      - name: Self-audit (read-only, explicit non-certification)
        shell: bash
        run: |
          set -euo pipefail
          code=0
          python -m wolf_auditor . --output wolf-auditor-self-report.json --sarif wolf-auditor.sarif --sbom wolf-auditor.cdx.json || code=$?
          python - <<'PY'
          import json
          import sys
          report = json.load(open("wolf-auditor-self-report.json", encoding="utf-8"))
          if report["status"] in {"PASS", "REVIEWED", "APPROVED"}:
              sys.exit("self-audit must not claim approval")
          limits = report["analysis_limits"]
          if limits["coverage_claim"] is not False or limits["parser_stage"] != "token_heuristic":
              sys.exit("default scan changed its coverage claim or parser stage")
          if limits["rust_syn_backend"] != "not_invoked_default_scan_does_not_spawn":
              sys.exit("default scan invoked the syn backend")
          allowed = {
              "rust_cfg_unresolved",
              "rust_macro_not_expanded",
              "rust_name_resolution_unresolved",
              "rust_heuristic_unclassified_unsafe",
              "rust_heuristic_unclassified_extern",
          }
          for gap in report["coverage_gaps"]:
              path = gap["path"].replace("\\", "/")
              if not path.startswith("tools/wolf_syn/") or gap["reason"] not in allowed:
                  sys.exit(f"unexpected coverage gap: {gap}")
          print(
              f"self-audit status={report['status']} "
              f"gaps={len(report['coverage_gaps'])} findings={len(report['findings'])}"
          )
          PY
          if [ "$code" -gt 2 ]; then
            exit "$code"
          fi
          echo "Heuristic findings are inventory, not an independent security approval"
      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4.6.2
        if: always()
        with:
          name: baseline-evidence-${{ matrix.os }}
          path: |
            wolf-auditor-self-report.json
            wolf-auditor.sarif
            wolf-auditor.cdx.json
          if-no-files-found: ignore
