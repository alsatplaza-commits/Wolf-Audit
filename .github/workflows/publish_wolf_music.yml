name: Publish WOLF Music APK download
on:
  push:
    branches: [wolf-music-downloads]
    paths: ['.github/workflows/publish_wolf_music.yml']
permissions:
  contents: write
jobs:
  publish:
    runs-on: ubuntu-latest
    timeout-minutes: 8
    steps:
      - uses: actions/checkout@v4
      - name: Download signed Android APK from private CI artifact
        env:
          DOWNLOAD_ZIP: "https://sdmntpritalynorth.oaiusercontent.com/files/00000000-8334-8246-abbf-a9179ca2a752/raw?se=2026-10-11T14%3A16%3A47Z&sp=r&sv=2026-02-06&sr=b&scid=fad3b05e-212f-534c-a55f-c9d3ef0a8737&skoid=82a3371f-2f6c-4f81-8a78-2701b362559b&sktid=a48cca56-e6da-484e-a814-9c849652bcb3&skt=2026-10-11T01%3A51%3A56Z&ske=2026-10-12T01%3A51%3A56Z&sks=b&skv=2026-02-06&sig=NR/89cHQIfl%2BJBBV5xg1plK9nCbt1eQXiq87iTNYcL0%3D"
        run: |
          curl --fail --location --retry 3 --max-time 75 "$DOWNLOAD_ZIP" -o /tmp/wolf-music.zip
          unzip -t /tmp/wolf-music.zip
          unzip -p /tmp/wolf-music.zip app-debug.apk > WOLF_Music_v1.3.4.apk
          test -s WOLF_Music_v1.3.4.apk
          unzip -t WOLF_Music_v1.3.4.apk | tail -1
      - name: Commit APK only to public distribution branch
        run: |
          git config user.name 'wolf-music-release-bot'
          git config user.email 'wolf-music-release-bot@users.noreply.github.com'
          git add WOLF_Music_v1.3.4.apk
          git commit -m 'Add WOLF Music v1.3.4 Android installation APK'
          git push origin HEAD:wolf-music-downloads
