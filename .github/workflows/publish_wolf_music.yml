name: Publish WOLF Music APK download
on:
  push:
    branches: [wolf-music-downloads]
    paths: ['.github/workflows/publish_wolf_music.yml']
permissions:
  contents: write
jobs:
  publish:
    runs-on: ubuntu-latest
    timeout-minutes: 8
    steps:
      - uses: actions/checkout@v4
      - name: Download signed Android APK from private CI artifact
        env:
          DOWNLOAD_ZIP: "https://sdmntprdenmarkeast.oaiusercontent.com/files/00000000-86c4-8210-955d-dfa2d365f6b2/raw?se=2026-10-11T14%3A36%3A47Z&sp=r&sv=2026-02-06&sr=b&scid=d9c3949c-5e9d-5b2c-97aa-aa0e12f48c35&skoid=5bfb38a5-43fb-4c63-80a1-6ae1e97e2e16&sktid=a48cca56-e6da-484e-a814-9c849652bcb3&skt=2026-10-11T05%3A22%3A50Z&ske=2026-10-12T05%3A22%3A50Z&sks=b&skv=2026-02-06&sig=q1fpqc%2Bn2cfgv/VOf%2BjWiKsgVt5ZBcMKF1dRZvHrykQ%3D"
        run: |
          curl --fail --location --retry 3 --max-time 75 "$DOWNLOAD_ZIP" -o /tmp/wolf-music.zip
          unzip -t /tmp/wolf-music.zip
          unzip -p /tmp/wolf-music.zip app-debug.apk > WOLF_Music_v1.3.6.apk
          test -s WOLF_Music_v1.3.6.apk
          unzip -t WOLF_Music_v1.3.6.apk | tail -1
      - name: Commit APK only to public distribution branch
        run: |
          git config user.name 'wolf-music-release-bot'
          git config user.email 'wolf-music-release-bot@users.noreply.github.com'
          git add WOLF_Music_v1.3.6.apk
          git commit -m 'Add WOLF Music v1.3.6 Android installation APK'
          git push origin HEAD:wolf-music-downloads
