name: Publish WOLF Music APK download
on:
  push:
    branches: [wolf-music-downloads]
    paths: ['.github/workflows/publish_wolf_music.yml']
  workflow_dispatch:
permissions:
  contents: read
jobs:
  publish:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - name: Refuse signed object downloads
        shell: bash
        run: |
          echo "Automatic fetch of a signed object URL is disabled."
          echo "This workflow does not download, commit, or push."
          exit 1
