name: Publish WOLF Music APK download
on:
  push:
    branches: [wolf-music-downloads]
    paths: ['.github/workflows/publish_wolf_music.yml']
permissions:
  contents: write
jobs:
  publish:
    runs-on: ubuntu-latest
    timeout-minutes: 8
    steps:
      - uses: actions/checkout@v4
      - name: Download signed Android APK from private CI artifact
        env:
          DOWNLOAD_ZIP: "https://sdmntpritalynorth.oaiusercontent.com/files/00000000-fc98-8246-b5e1-24fd5f57beeb/raw?se=2026-10-12T03%3A43%3A43Z&sp=r&sv=2026-02-06&sr=b&scid=633d4300-0821-51d0-9921-f34bf59b0b0b&skoid=82a3371f-2f6c-4f81-8a78-2701b362559b&sktid=a48cca56-e6da-484e-a814-9c849652bcb3&skt=2026-10-11T22%3A44%3A34Z&ske=2026-10-12T22%3A44%3A34Z&sks=b&skv=2026-02-06&sig=P6nQmFhGe6lzR73Gb69Y0ANP3ix1rIh47vt6Nu8NLzw%3D"
        run: |
          curl --fail --location --retry 3 --max-time 75 "$DOWNLOAD_ZIP" -o /tmp/wolf-music.zip
          unzip -t /tmp/wolf-music.zip
          unzip -p /tmp/wolf-music.zip app-debug.apk > WOLF_Music_v1.3.10.apk
          cp WOLF_Music_v1.3.10.apk WOLF_Music_Latest.apk
          test -s WOLF_Music_v1.3.10.apk
          unzip -t WOLF_Music_v1.3.10.apk | tail -1
      - name: Commit APK only to public distribution branch
        run: |
          git config user.name 'wolf-music-release-bot'
          git config user.email 'wolf-music-release-bot@users.noreply.github.com'
          git add WOLF_Music_v1.3.10.apk WOLF_Music_Latest.apk
          git commit -m 'Add WOLF Music v1.3.10 Android installation APK'
          git push origin HEAD:wolf-music-downloads
