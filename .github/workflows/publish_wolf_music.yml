name: Publish WOLF Music APK download
on:
  push:
    branches: [wolf-music-downloads]
    paths: ['.github/workflows/publish_wolf_music.yml']
permissions:
  contents: write
jobs:
  publish:
    runs-on: ubuntu-latest
    timeout-minutes: 8
    steps:
      - uses: actions/checkout@v4
      - name: Download signed Android APK from private CI artifact
        env:
          DOWNLOAD_ZIP: "https://sdmntprnortheu.oaiusercontent.com/files/00000000-c5c8-81f4-a062-4fd3abc0360a/raw?se=2026-10-11T15%3A02%3A30Z&sp=r&sv=2026-02-06&sr=b&scid=2e1aad78-88c6-5042-a056-61b2f80e7fca&skoid=5bfb38a5-43fb-4c63-80a1-6ae1e97e2e16&sktid=a48cca56-e6da-484e-a814-9c849652bcb3&skt=2026-10-11T05%3A22%3A50Z&ske=2026-10-12T05%3A22%3A50Z&sks=b&skv=2026-02-06&sig=Cm/%2B9AKudgB27PQtOi57livQAcm2/ZdNOZBNjvOuhn4%3D"
        run: |
          curl --fail --location --retry 3 --max-time 75 "$DOWNLOAD_ZIP" -o /tmp/wolf-music.zip
          unzip -t /tmp/wolf-music.zip
          unzip -p /tmp/wolf-music.zip app-debug.apk > WOLF_Music_v1.3.7.apk
          test -s WOLF_Music_v1.3.7.apk
          unzip -t WOLF_Music_v1.3.7.apk | tail -1
      - name: Commit APK only to public distribution branch
        run: |
          git config user.name 'wolf-music-release-bot'
          git config user.email 'wolf-music-release-bot@users.noreply.github.com'
          git add WOLF_Music_v1.3.7.apk
          git commit -m 'Add WOLF Music v1.3.7 Android installation APK'
          git push origin HEAD:wolf-music-downloads
