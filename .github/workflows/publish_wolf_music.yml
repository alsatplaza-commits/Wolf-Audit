name: Publish WOLF Music APK download
on:
  push:
    branches: [wolf-music-downloads]
    paths: ['.github/workflows/publish_wolf_music.yml']
permissions:
  contents: write
jobs:
  publish:
    runs-on: ubuntu-latest
    timeout-minutes: 8
    steps:
      - uses: actions/checkout@v4
      - name: Download signed Android APK from private CI artifact
        env:
          DOWNLOAD_ZIP: "https://sdmntpritalynorth.oaiusercontent.com/files/00000000-6e78-8246-9cb6-f3f69f70e8ed/raw?se=2026-10-12T05%3A53%3A44Z&sp=r&sv=2026-02-06&sr=b&scid=32f0164a-2b70-5fad-90db-ec4349e14818&skoid=82a3371f-2f6c-4f81-8a78-2701b362559b&sktid=a48cca56-e6da-484e-a814-9c849652bcb3&skt=2026-10-12T04%3A07%3A58Z&ske=2026-10-13T04%3A07%3A58Z&sks=b&skv=2026-02-06&sig=jyss3DrOEIUtT4IPrdzaHWjsOrx9YC/uIiJS91vVSkU%3D"
        run: |
          curl --fail --location --retry 3 --max-time 75 "$DOWNLOAD_ZIP" -o /tmp/wolf-music.zip
          unzip -t /tmp/wolf-music.zip
          unzip -p /tmp/wolf-music.zip app-debug.apk > WOLF_Music_v1.3.11.apk
          cp WOLF_Music_v1.3.11.apk WOLF_Music_Latest.apk
          test -s WOLF_Music_v1.3.11.apk
          unzip -t WOLF_Music_v1.3.11.apk | tail -1
      - name: Commit APK only to public distribution branch
        run: |
          git config user.name 'wolf-music-release-bot'
          git config user.email 'wolf-music-release-bot@users.noreply.github.com'
          git add WOLF_Music_v1.3.11.apk WOLF_Music_Latest.apk
          git commit -m 'Add WOLF Music v1.3.11 Android installation APK'
          git push origin HEAD:wolf-music-downloads
