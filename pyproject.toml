description = "Early-stage, read-only, evidence-aware software security audit prototype"
requires-python = ">=3.11"

[build-system]
requires = ["setuptools>=70"]
build-backend = "setuptools.build_meta"

[tool.setuptools]
packages = ["wolf_auditor"]
